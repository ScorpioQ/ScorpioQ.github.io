<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAGTodo · 独立 CloudKit 认证</title><link rel="stylesheet" href="style.css">
<main><h1>独立 CloudKit 认证验证</h1><p>不加载 CloudKit JS。使用新的 Apple 登录回调，只执行一次带会话的 users/current 请求。不会读取或修改任务。</p>
<form id="login"><label>iCloud.DAGTodo 网页 API Token<input id="token" required autocomplete="off" spellcheck="false"></label><button id="start">开始独立登录</button></form>
<p>Token 回调必须为 Post Message。Token 和会话仅保存在内存，不显示或记录。</p><p id="status" role="status">尚未开始</p><pre id="log"></pre></main>
<script type="module">
'use strict';
const $ = id => document.getElementById(id);
let popup, apiToken, verifying = false, timer;
function log(text) {$('log').textContent += `${new Date().toLocaleTimeString()} ${text}\n`;}
function finish(text) {clearTimeout(timer); $('status').textContent = text; $('start').disabled = false; apiToken = null; popup?.close(); popup = null;}
async function current(session) {
  const url = new URL('https://api.apple-cloudkit.com/database/1/iCloud.DAGTodo/development/public/users/current');
  url.searchParams.set('ckAPIToken',apiToken);
  if (session) url.searchParams.set('ckWebAuthToken',session);
  const response = await fetch(url,{credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(15000)});
  const result = await response.json();
  log(`HTTP ${response.status}；${String(result.serverErrorCode || (result.userRecordName ? 'USER_CONFIRMED' : 'UNKNOWN')).replace(/[^A-Z0-9_]/gi,'')}`);
  if (result.uuid) log(`请求标识 ${String(result.uuid).replace(/[^A-Za-z0-9-]/g,'').slice(0,64)}`);
  return {response,result};
}
window.addEventListener('message',async event => {
  if (!popup || event.source !== popup || verifying) return;
  let host; try {host = new URL(event.origin).hostname;} catch {return;}
  if (!['apple.com','icloud.com','apple-cloudkit.com'].some(domain => host === domain || host.endsWith('.'+domain))) return;
  const session = event.data?.ckWebAuthToken || event.data?.ckSession;
  if (typeof session !== 'string' || !session) return;
  verifying = true; clearTimeout(timer);
  log('已收到新会话，执行唯一一次带会话请求'); $('status').textContent = '正在验证新会话……';
  try {
    const {response,result} = await current(session);
    finish(response.ok && result.userRecordName ? '独立 REST 认证成功。测试结束，不继续使用此会话。' : '独立 REST 认证失败。此新会话未被 SDK 或其他请求使用，错误见上方。');
  } catch {finish('请求失败：网络、CORS、响应格式或超时。未自动重试，请检查浏览器网络面板。');}
});
$('login').onsubmit = async event => {
  event.preventDefault();
  if ($('start').disabled) return;
  apiToken = $('token').value.trim();
  popup = window.open('about:blank','dagtodo-rest-auth','width=640,height=600');
  if (!popup) {apiToken=null; $('status').textContent='浏览器阻止了弹窗，请允许后重试。';return;}
  $('token').value=''; $('start').disabled=true; verifying=false; $('log').textContent='';
  log(`REST 独立版本 1；${location.origin}；Development`); $('status').textContent='正在获取 Apple 登录地址……';
  try {
    const {result} = await current();
    const redirect = new URL(result.redirectURL);
    if (result.serverErrorCode !== 'AUTHENTICATION_REQUIRED' || redirect.protocol !== 'https:' || !['apple.com','icloud.com','apple-cloudkit.com'].some(domain => redirect.hostname === domain || redirect.hostname.endsWith('.'+domain))) throw new Error();
    popup.location.href=redirect.href; $('status').textContent='请在弹窗完成 Apple 登录';
    timer=setTimeout(() => finish('两分钟内未完成回调。测试结束，可重新开始。'),120000);
  } catch {finish('无法获取有效的 Apple 登录地址。请确认 Token、容器和网络。');}
};
</script>
</html>
